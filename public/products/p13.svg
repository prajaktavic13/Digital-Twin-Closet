<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F7F4EF" />
      <stop offset="100%" stop-color="#EBE5DC" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1C1A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  
  <!-- Subtle atelier frame -->
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#E6DFD5" stroke-width="1" />

  <!-- Pedestal glow -->
  <ellipse cx="200" cy="330" rx="90" ry="14" fill="#1E1C1A" opacity="0.05" />

  <!-- Garment Graphic -->
  <g filter="url(#shadow)">
    
        <!-- Ribbed Knit Dress Silhouette -->
        <path d="M160 100 L240 100 L245 130 L275 165 L255 178 L240 155 L242 220 Q245 250 238 300 L162 300 Q155 250 158 220 L160 155 L145 178 L125 165 L155 130 Z" fill="#CBBBA3" stroke="#B2A086" stroke-width="2" />
        <!-- Mockneck collar -->
        <rect x="180" y="92" width="40" height="12" rx="2" fill="#B2A086" opacity="0.8"/>
        <!-- Ribbed vertical lines -->
        <line x1="185" y1="110" x2="185" y2="295" stroke="#B2A086" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
        <line x1="200" y1="110" x2="200" y2="295" stroke="#B2A086" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
        <line x1="215" y1="110" x2="215" y2="295" stroke="#B2A086" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
      
  </g>

  <!-- Subtle Brand Watermark -->
  <text x="200" y="372" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#A8A196">ATELIER NORD</text>
</svg>