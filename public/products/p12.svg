<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F7F4EF" />
      <stop offset="100%" stop-color="#EBE5DC" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1C1A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  
  <!-- Subtle atelier frame -->
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#E6DFD5" stroke-width="1" />

  <!-- Pedestal glow -->
  <ellipse cx="200" cy="330" rx="90" ry="14" fill="#1E1C1A" opacity="0.05" />

  <!-- Garment Graphic -->
  <g filter="url(#shadow)">
    
        <!-- Slip Dress Silhouette -->
        <!-- Thin Straps -->
        <line x1="175" y1="90" x2="175" y2="120" stroke="#374F41" stroke-width="2"/>
        <line x1="225" y1="90" x2="225" y2="120" stroke="#374F41" stroke-width="2"/>
        <!-- Flowing Dress Body -->
        <path d="M165 120 L235 120 L240 160 Q245 200 235 230 L260 300 L140 300 L165 230 Q155 200 160 160 Z" fill="#4D6B5A" stroke="#374F41" stroke-width="2" />
        <!-- Soft Draped Neckline -->
        <path d="M165 120 Q200 145 235 120" fill="none" stroke="#374F41" stroke-width="1.5"/>
        <!-- Subtle Satin Sheen Wave -->
        <path d="M185 150 Q205 210 195 285" fill="none" stroke="#FFF" stroke-width="4" opacity="0.15"/>
      
  </g>

  <!-- Subtle Brand Watermark -->
  <text x="200" y="372" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#A8A196">MAISON MODERNE</text>
</svg>