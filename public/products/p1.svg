<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F7F4EF" />
      <stop offset="100%" stop-color="#EBE5DC" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1C1A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  
  <!-- Subtle atelier frame -->
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#E6DFD5" stroke-width="1" />

  <!-- Pedestal glow -->
  <ellipse cx="200" cy="330" rx="90" ry="14" fill="#1E1C1A" opacity="0.05" />

  <!-- Garment Graphic -->
  <g filter="url(#shadow)">
    
        <!-- T-Shirt Silhouette -->
        <path d="M140 110 L170 125 L230 125 L260 110 L285 155 L255 175 L245 155 L245 285 L155 285 L155 155 L145 175 L115 155 Z" fill="#ECE7DE" stroke="#D8D0C3" stroke-width="2" />
        <!-- Collar -->
        <path d="M170 125 Q200 150 230 125" fill="none" stroke="#D8D0C3" stroke-width="3" stroke-linecap="round"/>
        <!-- Sleeve stitching -->
        <path d="M145 175 L125 160" stroke="#D8D0C3" stroke-width="1.5" stroke-dasharray="3,3"/>
        <path d="M255 175 L275 160" stroke="#D8D0C3" stroke-width="1.5" stroke-dasharray="3,3"/>
        <!-- Hem stitching -->
        <line x1="155" y1="277" x2="245" y2="277" stroke="#D8D0C3" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>
      
  </g>

  <!-- Subtle Brand Watermark -->
  <text x="200" y="372" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#A8A196">ATELIER NORD</text>
</svg>