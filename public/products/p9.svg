<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F7F4EF" />
      <stop offset="100%" stop-color="#EBE5DC" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1C1A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  
  <!-- Subtle atelier frame -->
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#E6DFD5" stroke-width="1" />

  <!-- Pedestal glow -->
  <ellipse cx="200" cy="330" rx="90" ry="14" fill="#1E1C1A" opacity="0.05" />

  <!-- Garment Graphic -->
  <g filter="url(#shadow)">
    
        <!-- Overcoat Silhouette -->
        <path d="M130 95 L170 108 L230 108 L270 95 L295 180 L265 190 L260 300 L140 300 L135 190 L105 180 Z" fill="#B59475" stroke="#9A795B" stroke-width="2" />
        <!-- Wide Lapels -->
        <polygon points="170,108 200,180 180,185 145,130" fill="#9A795B" opacity="0.7"/>
        <polygon points="230,108 200,180 220,185 255,130" fill="#9A795B" opacity="0.7"/>
        <!-- Overcoat Split / Buttons -->
        <line x1="200" y1="180" x2="200" y2="300" stroke="#9A795B" stroke-width="2.5"/>
        <circle cx="208" cy="200" r="4" fill="#9A795B"/>
        <circle cx="208" cy="235" r="4" fill="#9A795B"/>
        <circle cx="208" cy="270" r="4" fill="#9A795B"/>
        <!-- Welt pockets -->
        <rect x="145" y="225" width="30" height="5" rx="1" fill="#9A795B" opacity="0.8"/>
        <rect x="225" y="225" width="30" height="5" rx="1" fill="#9A795B" opacity="0.8"/>
      
  </g>

  <!-- Subtle Brand Watermark -->
  <text x="200" y="372" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#A8A196">MAISON MODERNE</text>
</svg>