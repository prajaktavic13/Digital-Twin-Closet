<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F7F4EF" />
      <stop offset="100%" stop-color="#EBE5DC" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1C1A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  
  <!-- Subtle atelier frame -->
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#E6DFD5" stroke-width="1" />

  <!-- Pedestal glow -->
  <ellipse cx="200" cy="330" rx="90" ry="14" fill="#1E1C1A" opacity="0.05" />

  <!-- Garment Graphic -->
  <g filter="url(#shadow)">
    
        <!-- Chelsea Desert Boot Silhouette -->
        <g transform="translate(10, 20)">
          <!-- Lug Sole -->
          <path d="M110 230 L110 250 L145 250 L145 240 L250 240 C280 240 295 230 300 220 L300 235 C290 245 260 248 220 248 L110 248 Z" fill="#4A3F35" stroke="#877665" stroke-width="2"/>
          <!-- Boot Shaft & Upper -->
          <path d="M140 120 L195 120 L200 175 C225 180 255 190 280 205 C295 212 298 222 298 226 L125 228 L140 120 Z" fill="#A39281" stroke="#877665" stroke-width="2"/>
          <!-- Elastic Side Gusset -->
          <polygon points="160,125 182,125 186,175 156,175" fill="#3D3228" stroke="#877665" stroke-width="1.5"/>
          <!-- Pull tab -->
          <rect x="145" y="110" width="8" height="15" rx="2" fill="#3D3228"/>
        </g>
      
  </g>

  <!-- Subtle Brand Watermark -->
  <text x="200" y="372" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#A8A196">STEP STUDIO</text>
</svg>