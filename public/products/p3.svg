<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F7F4EF" />
      <stop offset="100%" stop-color="#EBE5DC" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1C1A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  
  <!-- Subtle atelier frame -->
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#E6DFD5" stroke-width="1" />

  <!-- Pedestal glow -->
  <ellipse cx="200" cy="330" rx="90" ry="14" fill="#1E1C1A" opacity="0.05" />

  <!-- Garment Graphic -->
  <g filter="url(#shadow)">
    
        <!-- Shirt Silhouette -->
        <path d="M135 112 L170 122 L230 122 L265 112 L290 160 L260 178 L250 155 L250 290 L150 290 L150 155 L140 178 L110 160 Z" fill="#F6F3EE" stroke="#E2DBD0" stroke-width="2" />
        <!-- Collar flaps -->
        <polygon points="175,122 200,150 185,160 165,125" fill="#E2DBD0" opacity="0.6"/>
        <polygon points="225,122 200,150 215,160 235,125" fill="#E2DBD0" opacity="0.6"/>
        <!-- Placket & Buttons -->
        <line x1="200" y1="150" x2="200" y2="290" stroke="#E2DBD0" stroke-width="2.5" />
        <circle cx="200" cy="170" r="3" fill="#FFF" stroke="#E2DBD0" stroke-width="1"/>
        <circle cx="200" cy="205" r="3" fill="#FFF" stroke="#E2DBD0" stroke-width="1"/>
        <circle cx="200" cy="240" r="3" fill="#FFF" stroke="#E2DBD0" stroke-width="1"/>
        <circle cx="200" cy="275" r="3" fill="#FFF" stroke="#E2DBD0" stroke-width="1"/>
        <!-- Pocket -->
        <rect x="162" y="170" width="24" height="28" rx="2" fill="none" stroke="#E2DBD0" stroke-width="1.5" />
      
  </g>

  <!-- Subtle Brand Watermark -->
  <text x="200" y="372" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#A8A196">ATELIER NORD</text>
</svg>